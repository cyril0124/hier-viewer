name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint-and-test-linux:
    name: Check, Lint, And Test Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libsqlite3-dev zlib1g-dev

      - name: Check
        run: cargo check --locked

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked
