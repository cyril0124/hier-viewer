[package]
name = "hier-viewer"
version = "1.1.1"
edition = "2024"
description = "Static hierarchy viewer for large RTL designs"
readme = "README.md"
repository = "https://github.com/cyril0124/hier-viewer"
homepage = "https://github.com/cyril0124/hier-viewer"
keywords = ["rtl", "verilog", "systemverilog", "viewer", "eda"]
categories = ["command-line-utilities", "visualization"]
default-run = "hier-viewer"
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/README.zh-CN.md",
  "/CHANGELOG.md",
  "/build.rs",
  "/cpp-hier-exporter/CMakeLists.txt",
  "/cpp-hier-exporter/src/**",
  "/rust-hier-viewer/src/**/*.rs",
  "/rust-hier-viewer/src/html/*.html",
  "/rust-hier-viewer/src/html/*.css",
  "/rust-hier-viewer/src/html/generated/*.js",
  "/rust-hier-viewer/src/html/vendor/*.js",
]

[[bin]]
name = "hier-viewer"
path = "rust-hier-viewer/src/main.rs"

[dependencies]
crossterm = "0.28.1"
flate2 = "1.1.2"
fuzzy-matcher = "0.3.7"
globset = "0.4.16"
libc = "0.2.177"
ratatui = "0.29.0"
rayon = "1.10.0"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
self-replace = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }
shell-words = "1.1.0"
tar = "0.4.44"
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros"] }
walkdir = "2.5.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[build-dependencies]
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros"] }
