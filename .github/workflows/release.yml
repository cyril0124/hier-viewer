name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.label }} Release Binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            asset_name: hier-viewer-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            binary_path: target/release/hier-viewer
            packaged_binary_name: hier-viewer
          - os: macos-15-intel
            label: macOS Intel
            asset_name: hier-viewer-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
            binary_path: target/release/hier-viewer
            packaged_binary_name: hier-viewer
          - os: macos-15
            label: macOS Apple Silicon
            asset_name: hier-viewer-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            binary_path: target/release/hier-viewer
            packaged_binary_name: hier-viewer
          - os: windows-2022
            label: Windows
            asset_name: hier-viewer-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
            binary_path: target/release/hier-viewer.exe
            packaged_binary_name: hier-viewer.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libsqlite3-dev zlib1g-dev binutils

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja --no-progress -y
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkgRoot\vcpkg.exe" install sqlite3:x64-windows-static zlib:x64-windows-static
          "HIER_VIEWER_EXPORTER_CMAKE_TOOLCHAIN_FILE=$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HIER_VIEWER_EXPORTER_VCPKG_TARGET_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_TARGET_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release binary
        run: cargo build --locked --release

      - name: Prepare Unix release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="dist"
          PACKAGE_DIR="${DIST_DIR}/package"
          mkdir -p "${PACKAGE_DIR}"
          cp "${{ matrix.binary_path }}" "${PACKAGE_DIR}/${{ matrix.packaged_binary_name }}"
          chmod +x "${PACKAGE_DIR}/${{ matrix.packaged_binary_name }}"
          strip "${PACKAGE_DIR}/${{ matrix.packaged_binary_name }}" || true
          tar -C "${PACKAGE_DIR}" -czf "${DIST_DIR}/${{ matrix.asset_name }}" "${{ matrix.packaged_binary_name }}"

      - name: Prepare Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $distDir = "dist"
          $packageDir = Join-Path $distDir "package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "${{ matrix.binary_path }}" (Join-Path $packageDir "${{ matrix.packaged_binary_name }}")
          if (Test-Path "dist\\${{ matrix.asset_name }}") {
            Remove-Item "dist\\${{ matrix.asset_name }}" -Force
          }
          Compress-Archive -Path (Join-Path $packageDir "${{ matrix.packaged_binary_name }}") -DestinationPath "dist\\${{ matrix.asset_name }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: ${{ always() }}
    needs: build-release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hier-viewer-*
          path: dist
          merge-multiple: true

      - name: Verify at least one release artifact exists
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release artifacts were produced; refusing to publish an empty release." >&2
            exit 1
          fi
          echo "Publishing ${#artifacts[@]} release artifact(s)."

      - name: Build release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BODY_FILE="dist/release-notes.md"
          mkdir -p dist
          awk -v version="${VERSION}" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "${BODY_FILE}"
          sed -i '/./,$!d' "${BODY_FILE}"
          sed -i '/^\[[^]]\+\]: /d' "${BODY_FILE}"
          if [[ ! -s "${BODY_FILE}" ]]; then
            echo "Failed to extract release notes for ${VERSION} from CHANGELOG.md" >&2
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/*
