[package]
name = "hier-viewer"
version = "1.0.0"
edition = "2024"
readme = "README.md"
default-run = "hier-viewer"

[[bin]]
name = "hier-viewer"
path = "rust-hier-viewer/src/main.rs"

[dependencies]
crossterm = "0.28.1"
fuzzy-matcher = "0.3.7"
globset = "0.4.16"
libc = "0.2.177"
ratatui = "0.29.0"
rayon = "1.10.0"
regex = "1.12.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
shell-words = "1.1.0"
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros"] }
walkdir = "2.5.0"

[build-dependencies]
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros"] }
