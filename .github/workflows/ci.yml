name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint-and-test-linux:
    name: Check, Lint, And Test Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libsqlite3-dev zlib1g-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend types
        run: npm run typecheck

      - name: Verify embedded frontend assets
        run: npm run check:generated

      - name: Test frontend modules
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Test source reader
        run: npm run test:browser

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build test binaries
        run: cargo test --locked --no-run

      - name: Test
        run: timeout 60s cargo test --locked

      - name: Build CLI
        run: cargo build --locked

      - name: Test generated viewer
        run: npm run test:ui

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-ui-screenshots
          path: target/frontend-ui/screenshots
          if-no-files-found: ignore

      - name: Test exporter statistics
        run: |
          for exporter in target/debug/build/hier-viewer-*/out/cpp-hier-exporter-build/out/bin/slang-hier-exporter; do
            python3 cpp-hier-exporter/tests/test_parameterized_cache.py "$exporter"
          done

      - name: Test source dependency cache
        run: python3 tests/cache-dependencies.py target/debug/hier-viewer
